<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Zarządzanie kryzysowe: kompendium</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#1d2430;--muted:#5d6675;--line:#dfe3e8;--blue:#1e4d8c;--bad:#b42318}
@media (prefers-color-scheme:dark){:root{--bg:#14181f;--card:#1c222c;--ink:#e8ebf0;--muted:#9aa3b2;--line:#2c3442;--blue:#6a9fe0;--bad:#f0817a}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:20px}
form{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px}
h1{font-size:1.25rem;margin:0 0 4px}
p{margin:0 0 18px;color:var(--muted);font-size:.92rem}
label{display:block;font-size:.85rem;font-weight:600;margin-bottom:6px}
input[type=password]{width:100%;font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
input[type=password]:focus{outline:2px solid var(--blue);outline-offset:1px}
.rm{display:flex;gap:8px;align-items:center;font-size:.88rem;color:var(--muted);margin:12px 0 18px;font-weight:400}
button{width:100%;font:inherit;font-weight:600;padding:11px;border:0;border-radius:10px;background:var(--blue);color:#fff;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.err{color:var(--bad);font-size:.88rem;min-height:1.3em;margin:10px 0 0}
</style>
</head>
<body>
<form id="f" autocomplete="on">
  <h1>Zarządzanie kryzysowe</h1>
  <p>Kompendium do nauki. Dostęp wymaga hasła.</p>
  <label for="pw">Hasło</label>
  <input type="password" id="pw" name="password" autocomplete="current-password" autofocus required>
  <label class="rm"><input type="checkbox" id="rm"> Zapamiętaj na tym urządzeniu</label>
  <button type="submit" id="go">Otwórz</button>
  <div class="err" id="err" role="alert"></div>
</form>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const KEYNAME = 'zk-klucz-' + SALT.slice(0, 10);
const store = { get(){ try { return localStorage.getItem(KEYNAME); } catch(e){ return null; } },
                set(v){ try { localStorage.setItem(KEYNAME, v); } catch(e){} },
                del(){ try { localStorage.removeItem(KEYNAME); } catch(e){} } };
async function derive(pw){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(SALT), iterations:ITER, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, true, ['decrypt']);
}
async function openWith(key){
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(IV)}, key, b64(CT));
  const html = await new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  document.open(); document.write(html); document.close();
}
async function tryStored(){
  const s = store.get(); if (!s) return;
  try { const k = await crypto.subtle.importKey('raw', b64(s), 'AES-GCM', false, ['decrypt']); await openWith(k); }
  catch(e){ store.del(); }
}
if (!window.crypto || !crypto.subtle || !window.DecompressionStream){
  document.getElementById('err').textContent = 'Ta przeglądarka nie obsługuje odszyfrowania. Otwórz stronę w aktualnej wersji Chrome, Edge, Firefox lub Safari.';
} else tryStored();
document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const pw = document.getElementById('pw').value.trim(), btn = document.getElementById('go'), err = document.getElementById('err');
  if (!pw) return;
  btn.disabled = true; btn.textContent = 'Sprawdzam…'; err.textContent = '';
  try {
    const key = await derive(pw);
    if (document.getElementById('rm').checked){
      const raw = new Uint8Array(await crypto.subtle.exportKey('raw', key));
      store.set(btoa(String.fromCharCode(...raw)));
    }
    await openWith(key);
  } catch(x){
    store.del(); btn.disabled = false; btn.textContent = 'Otwórz'; err.textContent = 'Nieprawidłowe hasło.';
  }
});
})();
